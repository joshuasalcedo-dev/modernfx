# Uploads a release to Maven Central when a tag vX.Y.Z is pushed (or by hand, with a version).
# The upload waits under "Deployments" on central.sonatype.com until someone presses Publish there
# (autoPublish is off in the pom's "central" profile); drop the deployment there to cancel it.
# Secrets (this repository): MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (a Central Portal user token),
# SIGNING_KEY (an ASCII-armoured private PGP key) and SIGNING_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing $VERSION"
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # The theme test opens a window, so the tests run on a virtual display.
      - name: Test, sign and upload to Maven Central
        run: xvfb-run --auto-servernum mvn -B -Pcentral deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
